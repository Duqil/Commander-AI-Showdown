# Builds the replay website (pages/) and publishes it on GitHub Pages.
# It does nothing until Pages is switched on: Settings > Pages > Source: "GitHub Actions".
# To remove the site, delete this file and the pages/ folder (see pages/README.md).
name: Replay site

on:
  push:
    branches: [main]
    paths: ["pages/**", "showdown/viewer/static/**", ".github/workflows/replay-site.yml"]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write   # to save finished replays back (see the "Finish uploaded games" step)
  pages: write
  id-token: write

concurrency:
  group: replay-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A game uploaded straight from games/ gets its card pictures and title here,
      # and is saved back so this happens only once. (A push made with the
      # workflow's own token doesn't start this workflow again.)
      - name: Finish uploaded games
        run: |
          python -m pages.prepare_replays
          if [ -n "$(git status --porcelain pages/replays)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/replays
            git commit -m "Finish uploaded replays (card pictures and title)"
            git pull --rebase --quiet && git push
          fi
      - run: python -m pages.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/_site
      - id: deploy
        uses: actions/deploy-pages@v4
