# Builds a ready-to-run Windows zip and attaches it to a GitHub Release.
#
# It runs ONLY when you push a tag that starts with "v" (like v0.1.0), or when
# you press "Run workflow" on the Actions tab (that makes a test zip you can
# download from the run page, without making a release).
#
# To remove this feature: delete this file and scripts/package_windows.sh.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the zip

jobs:
  build:
    # Forge is Java, so its jars are the same on every system. Building on
    # Linux is faster; the Windows parts are just the bundled Java and Python.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Keep Maven's downloaded libraries between runs, so later builds are faster.
      - uses: actions/cache@v4
        with:
          path: vendor/m2
          key: m2-${{ hashFiles('scripts/setup_forge.sh') }}

      - name: Build Forge and the bridge
        run: ./scripts/setup_forge.sh

      - name: Make the Windows zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="test-${GITHUB_SHA::7}"; fi
          ./scripts/package_windows.sh "$VERSION"

      - name: Keep the zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          retention-days: 7

      - name: Create the GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # --prerelease marks it as "not final" on the Releases page.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Commander AI Showdown $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Windows: download the zip, unzip it, and double-click \"Start Commander AI Showdown.bat\". Built automatically from commit $GITHUB_SHA."
